# Copy to .github/workflows/flamin-check.yml in a shared product repository.
# Install the FLAMIN v4 verifier on the base branch before enabling this check.
name: FLAMIN verification

on:
  pull_request:

permissions:
  contents: read

jobs:
  snapshot:
    name: FLAMIN snapshot
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out the proposed merge
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          path: candidate
          fetch-depth: 0
          persist-credentials: false
      - name: Check out the base verifier
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ github.event.pull_request.base.sha }}
          path: verifier
          persist-credentials: false
      - name: Check changed files
        env:
          FLAMIN_BASE: ${{ github.event.pull_request.base.sha }}
        run: |
          python3 -B -E -s verifier/kit/engine/flamin_verify_snapshot.py candidate "$FLAMIN_BASE" --candidate "$GITHUB_SHA"
